[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leveling-up"
version = "0.1.0"
description = "Syncs Dexcom CGM and Tandem pump data into Nightscout for an at-a-glance widget."
requires-python = ">=3.12"
dependencies = [
    "pydexcom==0.5.1",
    "tconnectsync==3.0.3",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leveling-up = "leveling_up.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
